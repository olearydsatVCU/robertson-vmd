name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - name: One real page per route (avoids GitHub's 404 fallback for links in emails)
        run: |
          cp dist/index.html dist/404.html
          for r in mentor-registration mentor-confirmation mentor-dashboard mentor-schedule student-booking student-confirmation student-dashboard student-schedule admin admin-bookings; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
